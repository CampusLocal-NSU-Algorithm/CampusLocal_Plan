<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1a1d21;background:#f7f8fa;-webkit-font-smoothing:antialiased;}
    a{color:#2f6df0;text-decoration:none;} a:hover{color:#1f4fc4;}
    h1,h2,h3,p{margin:0;}
  </style>
</helmet>

<div style="width:1440px;height:840px;background:#f7f8fa;overflow:hidden;">
  <header style="display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 40px;background:#fff;border-bottom:1px solid #e6e9ee;">
    <div style="display:flex;align-items:center;gap:28px;">
      <div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z" stroke="#2f6df0" stroke-width="1.7"/><circle cx="12" cy="10" r="2.4" stroke="#2f6df0" stroke-width="1.7"/></svg>
        캠퍼스로컬
      </div>
      <nav style="display:flex;gap:20px;font-size:14px;color:#5b6470;"><span>지도</span><span>추천</span></nav>
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:#5b6470;"><div style="width:28px;height:28px;border-radius:999px;background:#dbe3ec;"></div>김성환 ▾</div>
  </header>

  <div style="max-width:1000px;margin:0 auto;padding:36px 40px;">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:24px;">
      <div style="width:52px;height:52px;border-radius:999px;background:#dbe3ec;"></div>
      <div>
        <div style="font-size:18px;font-weight:700;">김성환 님</div>
        <div style="font-size:12.5px;color:#8b95a3;">카카오 로그인 · 2026년 3월 가입</div>
      </div>
    </div>

    <!-- tabs -->
    <div style="display:flex;gap:24px;border-bottom:1px solid #e6e9ee;font-size:14px;margin-bottom:24px;">
      <div style="padding:12px 2px;color:#5b6470;">내 추천 조건</div>
      <div style="padding:12px 2px;font-weight:700;color:#2f6df0;border-bottom:2px solid #2f6df0;">즐겨찾기 3</div>
      <div style="padding:12px 2px;color:#5b6470;">내 리뷰 2</div>
    </div>

    <!-- saved condition summary card -->
    <div style="background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:18px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-size:13px;color:#5b6470;">저장된 추천 조건 · <b style="color:#1a1d21;">보증금 ≤ 1,000만 · 월세 ≤ 40만 · 통학 ≤ 20분 · 원룸·빌라 · 편의점·조용한 동네</b></div>
      <span style="font-size:13px;font-weight:600;color:#2f6df0;flex-shrink:0;">조건 수정</span>
    </div>

    <!-- favorites grid -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;">

      <div style="background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:18px;position:relative;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#2f6df0" style="position:absolute;right:14px;top:14px;"><path d="M12 21s-7-4.6-7-10a4.5 4.5 0 0 1 7-3.7A4.5 4.5 0 0 1 19 11c0 5.4-7 10-7 10Z"/></svg>
        <span style="font-size:11px;font-weight:600;color:#2f6df0;background:#eaf1fe;padding:2px 7px;border-radius:5px;">빌라</span>
        <div style="font-size:15px;font-weight:700;margin-top:10px;">행복빌라 · 성환리</div>
        <div style="font-size:13.5px;font-weight:600;margin-top:3px;">보증 300 / 월 33</div>
        <div style="font-size:12px;color:#5b6470;margin-top:8px;">도보 7분 · 버스 12분 · ★ 4.2</div>
      </div>

      <div style="background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:18px;position:relative;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#2f6df0" style="position:absolute;right:14px;top:14px;"><path d="M12 21s-7-4.6-7-10a4.5 4.5 0 0 1 7-3.7A4.5 4.5 0 0 1 19 11c0 5.4-7 10-7 10Z"/></svg>
        <span style="font-size:11px;font-weight:600;color:#2f6df0;background:#eaf1fe;padding:2px 7px;border-radius:5px;">오피스텔</span>
        <div style="font-size:15px;font-weight:700;margin-top:10px;">성환역 리브에스텔</div>
        <div style="font-size:13.5px;font-weight:600;margin-top:3px;">보증 500 / 월 40</div>
        <div style="font-size:12px;color:#5b6470;margin-top:8px;">도보 15분 · 버스 9분 · ★ 4.6</div>
      </div>

      <div style="background:#fff;border:1px solid #e6e9ee;border-radius:14px;padding:18px;position:relative;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#2f6df0" style="position:absolute;right:14px;top:14px;"><path d="M12 21s-7-4.6-7-10a4.5 4.5 0 0 1 7-3.7A4.5 4.5 0 0 1 19 11c0 5.4-7 10-7 10Z"/></svg>
        <span style="font-size:11px;font-weight:600;color:#5b6470;background:#f1f3f6;padding:2px 7px;border-radius:5px;">원룸</span>
        <div style="font-size:15px;font-weight:700;margin-top:10px;">성환리 원룸주택</div>
        <div style="font-size:13.5px;font-weight:600;margin-top:3px;">보증 200 / 월 30</div>
        <div style="font-size:12px;color:#5b6470;margin-top:8px;">도보 10분 · 버스 8분 · 후기 없음</div>
      </div>

    </div>
  </div>
</div>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":840}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
